[package]
name = "wisp_gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native egui GUI for TwistedWiSP — node-graph editor"

[[bin]]
name = "wisp_gui"
path = "src/main.rs"

[dependencies]
egui = "=0.36.2"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui-snarl = "=0.12.0"
wisp = { path = "../wisp", package = "twisted-wisp" }
crossbeam = "0.8"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
toml = "1.2.1"

rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
