[package]
license = "MIT OR Apache-2.0"
name = "twisted-wisp"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# ===== Core =====
indexmap = { version = "2.2", features = ["serde"] }
lazy_static = "1.4"
logos = "0.16"
pest = "2.7"
pest_derive = "2.7"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1.2"

# ===== Runner =====
# Audio
cpal = "0.18"
hound = "3.5"
# MIDI
midly = "0.5"
midir = "0.11"
# Core
crossbeam = "0.8"
inkwell = { version = "0.11", features = ["llvm22-1-prefer-dynamic"] }
rand = "0.10"
# Utilities
env_logger = "0.11"
log = "0.4"
ringbuffer = "0.16"
string-error = "0.1"
thiserror = "2.0"

